plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silverlight.dndadventurers'
    compileSdk 36

    defaultConfig {
        applicationId 'com.silverlight.dndadventurers'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
