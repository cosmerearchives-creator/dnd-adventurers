name: Publish DnD Adventurers Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'game/**'
      - 'app/**'
      - '.github/workflows/publish.yml'
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Godot and Web export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Render Blender woodland druid
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1 libopengl0 libx11-6
          blender -b -t 2 --python game/tools/render_druid.py
          test "$(find game/assets/druid -name '*.png' | wc -l)" -eq 56
      - name: Export Godot game for Android WebView
        run: |
          mkdir -p web-build app/src/main/assets/game
          godot --headless --path game --editor --quit
          godot --headless --path game --export-release Web "$GITHUB_WORKSPACE/web-build/index.html"
          test -s web-build/index.html
          cp -a web-build/. app/src/main/assets/game/
      - name: Restore permanent signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed Android APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon
      - name: Verify APK and prepare updater metadata
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/dnd-adventurers.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release-assets/dnd-adventurers.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release-assets/dnd-adventurers.apk | grep "versionCode='8'"
          sha256sum release-assets/dnd-adventurers.apk
          python3 - <<'PY'
          import hashlib,json,pathlib
          apk=pathlib.Path('release-assets/dnd-adventurers.apk')
          pathlib.Path('release-assets/update.json').write_text(json.dumps({'versionCode':8,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}))
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.1 >/dev/null 2>&1; then
            gh release upload v0.3.1 release-assets/dnd-adventurers.apk release-assets/update.json --clobber
          else
            gh release create v0.3.1 release-assets/dnd-adventurers.apk release-assets/update.json --title "DnD Adventurers 0.3.1" --notes "Improved woodland druid model with sculpted costume, detailed hair, boots, facial details and higher resolution sprites."
          fi
      - name: Verify updater download URLs
        run: |
          set -euo pipefail
          for name in update.json dnd-adventurers.apk; do
            curl -fLsS --retry 5 --retry-delay 3 -o "/tmp/$name" "https://github.com/${{ github.repository }}/releases/latest/download/$name"
            test -s "/tmp/$name"
          done
          python3 - <<'PY'
          import hashlib,json,pathlib
          meta=json.loads(pathlib.Path('/tmp/update.json').read_text())
          assert meta['versionCode']==8
          assert hashlib.sha256(pathlib.Path('/tmp/dnd-adventurers.apk').read_bytes()).hexdigest()==meta['sha256']
          PY
